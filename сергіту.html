<!DOCTYPE html><html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сергіту сәті</title><style>*{box-sizing:border-box}
.back-btn {

body{margin:0;font-family:Arial,"Segoe UI",sans-serif;background:#f3f9ff;color:#173850;min-height:100vh;display:grid;place-items:center;line-height:1.5}body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 0 0,#c9e8ff,transparent 50%),radial-gradient(ellipse at 100% 100%,#d4f8e9,transparent 50%)}main{width:min(1100px,100%);padding:28px}.heading{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:22px}.eyebrow{color:#1776c7;font-size:13px;font-weight:bold;letter-spacing:2px}h1{font-size:clamp(36px,6vw,64px);letter-spacing:-2px;line-height:1.15;margin:8px 0 10px}h1 span{color:#1776c7}p{margin:0;color:#506e84;font-size:18px}.badge{background:#ffffffbd;border:1px solid #d3e5f4;border-radius:18px;padding:16px 22px;font-size:17px;font-weight:bold;white-space:nowrap;box-shadow:0 10px 25px #174b7608}.frame{background:white;padding:12px;border:1px solid #d3e5f4;border-radius:25px;box-shadow:0 25px 65px #1c629722}.video{aspect-ratio:16/9;overflow:hidden;border-radius:16px;background:#e4f0fa}iframe{border:0;width:100%;height:100%;display:block}.bottom{display:flex;gap:20px;align-items:center;justify-content:space-between;margin-top:21px}.bottom p{font-size:14px}.button{display:inline-block;background:#1776c7;color:white;border-radius:13px;padding:13px 22px;text-decoration:none;font-weight:bold;white-space:nowrap;box-shadow:0 8px 20px #1776c725;transition:transform .2s,background .2s}.button:hover{background:#105ba0;transform:translateY(-2px)}.button:focus-visible{outline:3px solid #173850;outline-offset:4px}@media(max-width:600px){main{padding:22px 14px}.heading{display:block}.badge{display:inline-block;margin-top:15px;padding:9px 14px}.frame{padding:7px;border-radius:18px}.video{border-radius:12px}.bottom{flex-direction:column;align-items:start;gap:12px}h1{letter-spacing:-1px}.heading p{font-size:16px}}@media(prefers-reduced-motion:reduce){.button{transition:none}}</style></head><body>
    <button class="back-btn" onclick="history.back()">⬅ Артқа қайту</button><main><header class="heading"><div><div class="eyebrow">ҚИМЫЛДА • СЕРГІ • КҮЛІМДЕ</div><h1>Сергіту <span>сәті</span></h1><p>Орнымыздан тұрып, видеодағы қимылдарды бірге қайталайық!</p></div><div class="badge">Бірге сергіп алайық!</div></header><section class="frame" aria-label="Сергіту сәтінің видеосы"><div class="video"><iframe src="https://www.youtube.com/embed/G5g0VKVDw48?autoplay=0&rel=0" title="Сергіту сәті — YouTube видеосы" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div></section><div class="bottom"><p>Видеоны ойнату батырмасын басыңдар.<br>Видео ашылмаса, «YouTube-та ашу» батырмасын пайдаланыңдар.</p><a class="button" href="https://www.youtube.com/watch?v=G5g0VKVDw48" target="_blank" rel="noopener noreferrer">YouTube-та ашу</a></div></main></body></html>
